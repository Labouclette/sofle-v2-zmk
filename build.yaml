# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
- board: nice_nano//zmk
  shield: sofle_left
  snippet: studio-rpc-usb-uart
  cmake-args: -DCONFIG_ZMK_STUDIO=y -DEXTRA_DTC_OVERLAY_FILE=/__w/sofle-v2-zmk/sofle-v2-zmk/config/boards/shields/sofle/sofle_left.overlay
  artifact-name: sofle_left-nice_nano_v2

  - board: nice_nano//zmk
    shield: sofle_right
    cmake-args: -DEXTRA_DTC_OVERLAY_FILE=/__w/sofle-v2-zmk/sofle-v2-zmk/config/boards/shields/sofle/sofle_right.overlay
    artifact-name: sofle_right-nice_nano_v2

  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano_v2
